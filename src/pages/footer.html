<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Cosmo Trip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/footer.css">
</head>

<body>

    <footer class="container-footer">
        <div class="footer-content">
            <div class="footer-img-logo">
                <img src="../assets/images/Logo-footer.svg" alt="Logo Cosmo Trip" loading="lazy">
            </div>

            <div class="footer-informations">
                <h2>Quick links</h2>
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Features</a></li>
                    <li><a href="">Community</a></li>
                    <li><a href="">Support</a></li>
                </ul>
            </div>
            <div class="footer-informations">
                <h2>Help</h2>
                <ul>
                    <li><a href="">Help Centre</a></li>
                    <li><a href="">FAQ</a></li>
                    <li><a href="">Forum</a></li>
                </ul>
            </div>
            <div class="footer-informations">
                <h2>Social Media</h2>
                <ul>
                    <li><a href="">Facebook</a></li>
                    <li><a href="">Instagram</a></li>
                    <li><a href="">LinkedIn</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-subscribe">
            <h2>Join our mailing list for updates</h2>
            <form action="">
                <input type="email" placeholder="Your email address">
                <button type="submit">
                    <img src="../assets/images/arrow-narrow-right.svg" alt="Cadastrar email">
                </button>
            </form>
        </div>
    </footer>

</body>

</html>
