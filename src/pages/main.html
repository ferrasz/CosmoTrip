<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section Main</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>

    <main class="container-main">
        <div class="main-content">
            
            <div class="container-init">
                <div class="init-img">
                    <img src="../assets/images/decoration-circle.svg" alt="Ponto decoração início">
                </div> 
                <span>Início</span>
            </div>
            
            <h1>Sua próxima viagem pode ser para fora <span>deste mundo!</span></h1>
            <p>Explore Marte, Saturno, Júpiter e além com conforto e segurança.</p>
            
            <div class="container-btns-main">
                <div>
                    <nav class="btn-principal-main">
                        <a href="">Explorar destinos</a>
                    </nav>
                </div>
                <div>
                    <nav class="btn-packages-main">
                        <img src="../assets/images/icon-rocket.svg" alt="Icone de foguete">
                        <a href="">Ver pacotes</a>
                    </nav>
                </div>
            </div>
        </div>

        <div class="main-img">
            <img src="../assets/images/illustration-hero.svg" alt="Planeta tecnológico com pontos de destino">
        </div>
    </main>

</body>

</html>
